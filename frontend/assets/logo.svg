<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CivicMind logo">
  <defs>
    <linearGradient id="cmgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5811F"/>
      <stop offset="1" stop-color="#E8551E"/>
    </linearGradient>
  </defs>
  <!-- stylised brain: two symmetric hemispheres of thick rounded strokes -->
  <g fill="none" stroke="url(#cmgrad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- left hemisphere -->
    <path d="M31 9 C20 9 13 16 13 25 C7.5 27 6 32 7.5 37 C9 42 14 44 18 44 C18 50 23 55.5 31 55.5"/>
    <path d="M13 25 C17 25 19.5 22.5 19.5 18.5"/>
    <path d="M7.5 37 C12 37 14.5 34.5 14.5 30"/>
    <path d="M18 44 C22 44 24.5 41.5 24.5 37.5"/>
    <!-- right hemisphere (mirror) -->
    <path d="M33 9 C44 9 51 16 51 25 C56.5 27 58 32 56.5 37 C55 42 50 44 46 44 C46 50 41 55.5 33 55.5"/>
    <path d="M51 25 C47 25 44.5 22.5 44.5 18.5"/>
    <path d="M56.5 37 C52 37 49.5 34.5 49.5 30"/>
    <path d="M46 44 C42 44 39.5 41.5 39.5 37.5"/>
    <!-- central divide -->
    <path d="M32 9 L32 55.5" stroke-width="3"/>
  </g>
  <!-- circuit nodes -->
  <g fill="#E8551E">
    <circle cx="19.5" cy="18.5" r="2.1"/>
    <circle cx="14.5" cy="30" r="2.1"/>
    <circle cx="24.5" cy="37.5" r="2.1"/>
    <circle cx="44.5" cy="18.5" r="2.1"/>
    <circle cx="49.5" cy="30" r="2.1"/>
    <circle cx="39.5" cy="37.5" r="2.1"/>
  </g>
</svg>
