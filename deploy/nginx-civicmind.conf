# CivicMind — example Nginx site for a VPS (TLS terminated here, app on 127.0.0.1:8000).
# Copy to /etc/nginx/sites-available/civicmind, set server_name and certificate paths
# (e.g. from certbot), then: ln -s ../sites-available/civicmind /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
server {
    listen 80;
    server_name civicmind.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name civicmind.example.org;

    ssl_certificate     /etc/letsencrypt/live/civicmind.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/civicmind.example.org/privkey.pem;

    # Report videos are uploaded as raw bytes up to 30 MB (CIVICMIND_MEDIA_MAX_VIDEO_BYTES); other requests are smaller.
    client_max_body_size 32m;
    client_body_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Live updates (server-sent events): no buffering, long-lived. The token is in the query string,
    # so keep it out of the access log for this path.
    location /api/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        access_log off;
    }
}
